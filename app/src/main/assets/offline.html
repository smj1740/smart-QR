<!DOCTYPE html>
<html lang="ko">
<head>

  <title>연결할 수 없습니다</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;

      color: #12204a;

    main { text-align: center; padding: 24px; }

      font-weight: 700;

<body>

    <h1>연결할 수 없습니다</h1>
    <p>네트워크를 확인한 뒤 다시 시도해 주세요.</p>

</html>
